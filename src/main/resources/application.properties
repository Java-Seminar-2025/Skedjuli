
spring.application.name=Skedjuli


spring.datasource.url=jdbc:mysql://localhost:3307/skedjuli
spring.datasource.username=skeduser
spring.datasource.password=skedpass
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=none

# Flyway
spring.flyway.enabled=true
spring.flyway.url=jdbc:mysql://localhost:3307/skedjuli
spring.flyway.user=skeduser
spring.flyway.password=skedpass
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# Thymeleaf
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.servlet.content-type=text/html
spring.thymeleaf.cache=false

# Server
server.port=8080

# Development
spring.devtools.livereload.enabled=true
spring.devtools.restart.enabled=true

# Logging
logging.level.root=WARN
logging.level.org.springframework=INFO
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate=ERROR
spring.main.banner-mode=off
jwt.secret=some-long-static-secret-string-32+chars
