<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            display: flex;
            height: 100vh;
        }

        .left-side {
            flex: 1;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .right-side {
            width: 400px;
            padding: 40px;
            background: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .register-form {
            width: 100%;
        }

        h2 {
            color: #333;
            margin-bottom: 30px;
            text-align: center;
        }

        .role-toggle {
            display: flex;
            margin-bottom: 20px;
            border-radius: 4px;
            overflow: hidden;
            border: 1px solid #ddd;
        }

        .role-btn {
            flex: 1;
            padding: 12px;
            border: none;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .role-btn.student {
            background: #667eea;
            color: white;
        }

        .role-btn.professor {
            background: white;
            color: #667eea;
        }

        .role-btn.professor.active {
            background: linear-gradient(135deg, #ff6b9d 0%, #c779d0 100%);
            color: white;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: #555;
            font-weight: bold;
        }

        input[type="text"],
        input[type="email"],
        input[type="password"],
        input[type="date"],
        input[type="tel"],
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 14px;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
        }

        button:hover {
            background: #5a6fd8;
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
        }

        .error-message {
            color: red;
            font-size: 12px;
            margin-top: 5px;
        }

        .additional-fields {
            display: none;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #eee;
        }
    </style>
</head>
<body>

<div class="left-side">
    <!-- add some pic of the skedjuli tables or some feature display Later -->
</div>

<div class="right-side">
    <div class="register-form">
        <h2>Create Account</h2>

        <form th:action="@{/register}" method="post" id="registerForm">

            <div class="form-group">
                <label for="firstName">First Name</label>
                <input type="text" id="firstName" name="firstName" required>
            </div>

            <div class="form-group">
                <label for="lastName">Last Name</label>
                <input type="text" id="lastName" name="lastName" required>
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>
            </div>

            <div class="form-group">
                <label for="dateOfBirth">Date of Birth</label>
                <input type="date" id="dateOfBirth" name="dateOfBirth">
            </div>

            <!-- toggle button for role select-->
            <div class="role-toggle">
                <button type="button" class="role-btn student active" data-role="student">Student</button>
                <button type="button" class="role-btn professor" data-role="professor">Professor</button>
            </div>
            <input type="hidden" id="role" name="role" value="student">

            <!--  profesor fields -->
            <div id="professorFields" class="additional-fields">
                <div class="form-group">
                    <label for="department">Department</label>
                    <input type="text" id="department" name="department" maxlength="100">
                </div>

                <div class="form-group">
                    <label for="academicTitle">Academic Title</label>
                    <input type="text" id="academicTitle" name="academicTitle" maxlength="100">
                </div>

                <div class="form-group">
                    <label for="officeLocation">Office Location</label>
                    <input type="text" id="officeLocation" name="officeLocation" maxlength="30">
                </div>

                <div class="form-group">
                    <label for="phoneNumber">Phone Number</label>
                    <input type="tel" id="phoneNumber" name="phoneNumber" maxlength="20">
                </div>
            </div>

            <!-- student fields -->
            <div id="studentFields" class="additional-fields">
                <div class="form-group">
                    <label for="studyProgram">Study Program</label>
                    <select id="studyProgram" name="studyProgramId">
                        <option value="">Select Study Program</option>
                        <option value="1">Computer Science</option>
                        <option value="2">Electrical Engineering</option>
                        <option value="3">Mechanical Engineering</option>
                        <option value="4">Business Administration</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="enrollmentYear">Enrollment Year</label>
                    <input type="number" id="enrollmentYear" name="enrollmentYear" min="2000" max="2030">
                </div>

                <div class="form-group">
                    <label for="currentYear">Current Year</label>
                    <select id="currentYear" name="currentYear">
                        <option value="">Select Current Year</option>
                        <option value="1">1st Year</option>
                        <option value="2">2nd Year</option>
                        <option value="3">3rd Year</option>
                        <option value="4">4th Year</option>
                        <option value="5">5th Year</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirm Password</label>
                <input type="password" id="confirmPassword" name="confirmPassword" required>
            </div>

            <button type="submit">Register</button>
        </form>

        <div class="login-link">
            <p>Already have an account? <a th:href="@{/login}">Login here</a></p>
        </div>

        <!-- Prikaz grešaka ako postoje -->
        <div th:if="${error}" class="error-message">
            <p th:text="${error}"></p>
        </div>

        <div th:if="${success}" style="color: green; text-align: center; margin-top: 10px;">
            <p th:text="${success}"></p>
        </div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const studentBtn = document.querySelector('.role-btn.student');
        const professorBtn = document.querySelector('.role-btn.professor');
        const roleInput = document.getElementById('role');
        const professorFields = document.getElementById('professorFields');
        const studentFields = document.getElementById('studentFields');

        function toggleRole(selectedRole) {
            // Reset buttons
            studentBtn.classList.remove('active');
            professorBtn.classList.remove('active');

            // Hide all fields
            professorFields.style.display = 'none';
            studentFields.style.display = 'none';

            if (selectedRole === 'student') {
                studentBtn.classList.add('active');
                studentBtn.style.background = '#667eea';
                studentBtn.style.color = 'white';
                professorBtn.style.background = 'white';
                professorBtn.style.color = '#667eea';
                studentFields.style.display = 'block';
            } else {
                professorBtn.classList.add('active');
                professorBtn.style.background = 'linear-gradient(135deg, #ff6b9d 0%, #c779d0 100%)';
                professorBtn.style.color = 'white';
                studentBtn.style.background = 'white';
                studentBtn.style.color = '#667eea';
                professorFields.style.display = 'block';
            }

            roleInput.value = selectedRole;
        }

        studentBtn.addEventListener('click', () => toggleRole('student'));
        professorBtn.addEventListener('click', () => toggleRole('professor'));

        // Initialize with student selected
        toggleRole('student');
    });
</script>
</body>
</html>
